# An Awesome list: one YAML file per list, the file name is its URL (/awesome/modern-css).
# Every url must be https:// and every tag lowercase kebab-case, or the build fails
# (src/lib/awesome/awesome.ts). Tags cut across categories: what a link is
# (docs, article, tool, site) and what it's about.
title: Modern CSS
description: The CSS references I keep going back to while building this site, from color and dark mode to motion and layout.
updated: 2026-11-02
categories:
  - name: Color
    links:
      - title: oklch.com
        url: https://oklch.com
        description: Pick OKLCH colors and see which ones fit in sRGB and P3.
        tags: [tool, oklch]
      - title: 'OKLCH in CSS: why we moved from RGB and HSL'
        url: https://evilmartians.com/chronicles/oklch-in-css-why-quit-rgb-hsl
        description: Evil Martians on why OKLCH makes palettes easier to reason about than RGB or HSL.
        tags: [article, oklch]
      - title: light-dark()
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/color_value/light-dark
        description: One color for each color scheme, picked by the element's color-scheme.
        tags: [docs, dark-mode]
      - title: 'WCAG: Contrast (minimum)'
        url: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
        description: The 4.5:1 and 3:1 rules for text, and what counts as large text.
        tags: [docs, accessibility]

  - name: Dark mode
    links:
      - title: Your dark mode toggle is broken
        url: https://kilianvalkhof.com/2020/design/your-dark-mode-toggle-is-broken/
        description: Kilian Valkhof argues a theme toggle needs a way back to the system setting.
        tags: [article, dark-mode]
      - title: 'Dark mode toggles: two states are enough'
        url: https://lea.verou.me/blog/2026/dark-mode-toggles/
        description: Lea Verou makes the case for two visible states, the system theme and its opposite.
        tags: [article, dark-mode]
      - title: The best dark mode toggle is probably none
        url: https://lea.verou.me/blog/2026/dark-mode-toggles-2/
        description: Lea Verou's follow-up, on why most sites don't need a toggle at all.
        tags: [article, dark-mode]
      - title: The case for tri-state dark mode toggles
        url: https://www.bram.us/2026/08/18/the-case-for-tri-state-dark-mode-toggles/
        description: Bramus argues for showing all three states, system, light and dark.
        tags: [article, dark-mode]
      - title: Building a theme switch component
        url: https://web.dev/articles/building/a-theme-switch-component
        description: Adam Argyle builds an accessible light and dark switch, step by step.
        tags: [article, dark-mode, accessibility]

  - name: Motion
    links:
      - title: scroll-driven-animations.style
        url: https://scroll-driven-animations.style
        description: Demos and tools for animations driven by scrolling instead of time.
        tags: [site, motion]
      - title: CSS scroll-driven animations
        url: https://developer.mozilla.org/docs/Web/CSS/CSS_scroll-driven_animations
        description: The reference for animation-timeline, scroll() and view().
        tags: [docs, motion]
      - title: View Transition API
        url: https://developer.mozilla.org/docs/Web/API/View_Transition_API
        description: Animated changes between two states of a page, or between pages.
        tags: [docs, motion]
      - title: Unlocking view transitions in SvelteKit
        url: https://svelte.dev/blog/view-transitions
        description: How to run SvelteKit's navigations inside a view transition with onNavigate.
        tags: [article, motion, svelte]
      - title: prefers-reduced-motion
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/@media/prefers-reduced-motion
        description: The media feature that tells you someone asked for less motion.
        tags: [docs, motion, accessibility]

  - name: Layout
    links:
      - title: Container queries
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_queries
        description: Styles that respond to the size of a container instead of the viewport.
        tags: [docs, layout]
      - title: grid-template-areas
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/grid-template-areas
        description: Name the areas of a grid and place items by name.
        tags: [docs, layout]
      - title: auto-fill vs auto-fit
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/repeat#auto-fill
        description: The two ways repeat() fills a row, and why auto-fit stretches the cards.
        tags: [docs, layout]
      - title: position sticky
        url: https://developer.mozilla.org/docs/Web/CSS/position#sticky_positioning
        description: An element that scrolls with the page until it reaches an edge, then stays.
        tags: [docs, layout]

  - name: Foundations
    links:
      - title: A Modern CSS Reset
        url: https://www.joshwcomeau.com/css/custom-css-reset/
        description: Josh Comeau's small reset, with the reason for every line.
        tags: [article]
      - title: '@layer'
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/@layer
        description: Cascade layers, where the order of the layers beats specificity.
        tags: [docs]
      - title: Using CSS custom properties
        url: https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties
        description: Variables in CSS, how they inherit and how var() falls back.
        tags: [docs]
      - title: Open Props
        url: https://open-props.style/
        description: Ready-made design tokens as custom properties, the base of this site's tokens.
        tags: [tool]

  - name: Inspiration
    links:
      - title: nerdy.dev
        url: https://nerdy.dev
        description: Adam Argyle's site. This site's theme toggle reveal started here.
        tags: [site, motion]
      - title: brittanychiang.com
        url: https://brittanychiang.com
        description: The sticky intro beside scrolling sections that this site's landing borrows.
        tags: [site, layout]
      - title: julibe.com
        url: https://julibe.com
        description: Where the colored scrollbar, the detaching header and the footer hint came from.
        tags: [site]
