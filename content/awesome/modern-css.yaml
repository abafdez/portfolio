# An Awesome list: one YAML file per list, the file name is its URL (/awesome/modern-css).
# Every url must be https:// and every tag lowercase kebab-case, or the build fails
# (src/lib/awesome/awesome.ts). Tags cut across categories: what a link is
# (docs, article, tool, site) and what it's about.
# In Spanish: a text is plain (the same in every language) or { en: …, es: … }. Once the
# list's description is in both, every link's description must be too (else the build
# fails: the Spanish page would be half English); names and titles can stay plain.
# Link titles are the sources' own, so they stay as their authors wrote them.
title:
  en: Modern CSS
  es: CSS moderno
description:
  en: The CSS references I keep going back to while building this site, from color and dark mode to motion and layout.
  es: Las referencias de CSS a las que vuelvo una y otra vez mientras construyo este sitio, del color y el modo oscuro al movimiento y la maquetación.
updated: 2026-11-02
categories:
