          es: Ejecuta modelos de Hugging Face en JavaScript, en el navegador o en Node.
        tags: [library, browser]
      - title: WebLLM
        url: https://webllm.mlc.ai
        description:
          en: Chat models in the browser on the GPU through WebGPU.
