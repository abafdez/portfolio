          es: Lecciones animadas sobre cómo funcionan las redes neuronales y los transformers, sin necesidad de ser matemático.
        tags: [video, basics]
      - title: 'Neural Networks: Zero to Hero'
        url: https://karpathy.ai/zero-to-hero.html
        description:
          en: Andrej Karpathy builds a small GPT from scratch, in code, step by step.
          es: Andrej Karpathy construye un GPT pequeño desde cero, en código, paso a paso.
        tags: [video, basics]
      - title: Hugging Face Learn
        url: https://huggingface.co/learn
        description:
          en: Free courses on language models, agents and MCP.
          es: Cursos gratuitos sobre modelos de lenguaje, agentes y MCP.
        tags: [tutorial, basics]
  - name:
