# What I know, for /about (and the CV builder). Read at build time by
# src/lib/skills/skills.server.ts, which fails the build on a mistake and says where.
#
# A group: name, id (kebab-case, for links), description (one line), icon (Lucide),
# skills.
#
# A skill:
#   name:      what it is
#   logo:      a brand logo, by its Simple Icons slug (https://simpleicons.org), or
#   icon:      a generic Lucide icon, by name (https://lucide.dev/icons)
#   level:     1 Learning, 2 Comfortable, 3 Daily, 4 Could teach it (none: no bar)
#   profiles:  the kinds of job it matters for (ids from the list below)
#   note:      how I use it, in one line
#   evidence:  where it shows, each a label and one of
#              entry (a Devlog slug), tool (a /projects tool), list (an Awesome
#              list) or url (https://)
#
# Levels and profiles are claims about me: keep them honest.
#
# In Spanish: any text (a name, description, note, evidence label, profile name) is
# either plain, the same in every language (Docker), or one per language:
#   note:
#     en: How I use it.
#     es: Cómo lo uso.
# A skill's English name is its key: the CV builder stores edits by it, so renaming
# one in English drops what was saved for it. A skill without a level shows the first
# sentence of its note on the CV ("Spanish (Native)"), in each language.

# The kinds of job I apply for. /about and the CV builder filter skills by these.
profiles:
