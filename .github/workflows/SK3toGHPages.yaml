name: Deploy SK3 to GitHub Pages

on:
  # Push to `main` (a merged PR is a push) → check, build and deploy
  # Pull request to `main` → check and build only
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab on GitHub.

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read # clone the repo
  pages: write # create a Pages deployment
  id-token: write # get an OIDC token so deploy-pages can prove who it is

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # Gets the code from the repo to be executed
        uses: actions/checkout@v7

      - name: Setup pnpm with runtime # Install Node & PNPM and install dependencies in the same step
        uses: pnpm/setup@v3.0.0
        with:
          cache: true
          runtime: node@22
      # Separate steps so the Actions UI shows exactly which one failed
      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'

      - name: Upload GitHub Pages artifact # Prepares the files for deployment
        # Only upload when we're going to deploy (see the deploy job's `if`)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'

  deploy:
    needs: build
    # github.ref is `refs/heads/main` on a push to main or a manual run from main.
    # On a pull request it's `refs/pull/<number>/merge`, so PRs skip this job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Only one deployment at a time; PR checks above never wait on this.
    concurrency:
      group: 'pages'
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
