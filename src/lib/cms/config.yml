# Sveltia CMS, at /admin: in dev plugin.ts serves the page, on the live site it's built
# into build/admin (vite.config.ts in this folder). main.ts reads this file and passes it
# to CMS.init().
# Docs: https://sveltiacms.app/en/docs. How to use it: content/blog/posts/README.md.

# The local workflow ("Work with Local Repository") still needs a Git backend here; it
# never connects to GitHub, the repo name only partitions the browser's storage.
backend:
  name: github
  repo: abafdez/portfolio
  branch: main
  # A published change is one commit on main, not a merge commit plus every save.
  squash_merges: true
  # "Sign In with GitHub" on the live site goes through Sveltia's authenticator, a
  # Cloudflare Worker of our own (README.md in this folder, "On the live site"). Until
  # this is set, sign in with an access token or the local repository instead.
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

# The live site, for the CMS's "view on site" links.
site_url: https://abafdez.github.io/portfolio

# Signed in with GitHub, every change goes through a pull request: saving commits to a
# cms/<collection>/<slug> branch, Publish merges it, and CI builds the pull request
# first. Two stages (no "In review": GitHub doesn't let you approve your own pull
# request). Save and Publish commits straight to main, for a typo. Working with the
# local repository ignores all this and writes the files, as before.
# Not the same as a post's draft field: an unmerged pull request isn't on main at all;
# a merged post with draft: true is on main but left out of the site (drafts.ts).
publish_mode:
  type: editorial_workflow
  stages: [draft, pending_publish]
  direct_publish: true

# Required at the top; every collection keeps its images next to the entry instead.
media_folder: static/uploads

# <slug>.md is English, <slug>.es.md beside it is Spanish.
i18n:
  structure: multiple_files
  locales: [en, es]
  default_locale: en
  omit_default_locale_from_file_path: true
  # A new entry starts in English only; Spanish is switched on per entry when translated.
  initial_locales: default

slug:
  encoding: ascii
  clean_accents: true

# Shared by the three markdown collections (YAML anchors). main.ts resolves the anchors
# with the yaml package and drops this key before Sveltia sees it.
fields:
  title: &title { name: title, label: Title, widget: string, i18n: true }
  # A post that isn't on the site yet (only in pnpm dev): the build leaves it out, files
  # and all (drafts.ts). Publishing it is clearing this and saving. A select, not a
  # switch: a switch writes draft: false into every published post.
  draft: &draft
    name: draft
    label: Hidden on the site (draft)
    widget: select
    options: [{ label: 'Yes', value: true }]
    required: false
  date: &date
    name: date
    label: Date
    widget: datetime
    type: date
    format: YYYY-MM-DD
    default: '{{now}}'
  # A plain list (one text box per tag). Kebab-case is checked by the build (checkTags):
  # a per-item rule would turn every tag into a collapsible box.
  tags: &tags { name: tags, label: Tags, widget: list, required: false }
  description: &description { name: description, label: Description, widget: text, i18n: true }
  cover: &cover
    name: cover
    label: Cover alt text
    hint: The alt text of cover.avif in the post's folder.
    widget: string
    required: false
    i18n: true
  # Translations only: false until Alfonso has read it. Shown in English too (a field
  # can't be translation-only), where it must stay empty: a boolean switch always
  # writes true or false, a select can be left empty (and is then left out).
  reviewed: &reviewed
    name: reviewed
    label: Reviewed (translations only)
    widget: select
    options: [{ label: 'Yes', value: true }, { label: 'No', value: false }]
    required: false
    i18n: true
  # The cover's focal point, "x% y%", picked on the cover (cms/Focal.svelte). The site
  # doesn't read it yet: card thumbnails are still cropped from the middle (covers.ts).
  focus: &focus
    name: focus
    label: Cover focal point (not used yet)
    widget: focal
    required: false
  body: &body
    name: body
    label: Body
    widget: richtext
    i18n: true
    modes: [raw, rich_text]

# Images go in the entry's own folder, written as ./file.png (what the build expects).
# Not media_folder: '': with a path ending in {{slug}}, Sveltia would put them in a
# <slug>/ folder inside the entry's folder.
collections:
  - name: posts
    label: Blog posts
    label_singular: Post
    folder: content/blog/posts
    path: '{{slug}}/{{slug}}'
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    format: entry # cms/formats.ts: our own style, then Prettier
    media_folder: /content/blog/posts/{{slug}}
    public_folder: .
    i18n: true
    sortable_fields: [date, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    # The list's thumbnails: the cover isn't a field (cover: is its alt text), it's the
    # file named cover.* next to the post, as the site finds it (covers.server.ts). A
    # value starting with / is a file path with template tags; the first that exists wins.
    thumbnail:
      - /content/blog/posts/{{slug}}/cover.avif
      - /content/blog/posts/{{slug}}/cover.png
      - /content/blog/posts/{{slug}}/cover.jpg
      - /content/blog/posts/{{slug}}/cover.jpeg
      - /content/blog/posts/{{slug}}/cover.webp
    fields: [*title, *draft, *date, *tags, *description, *cover, *focus, *reviewed, *body]

  - name: devlog
    label: Devlog
    label_singular: Entry
    folder: content/bitacora
    path: '{{slug}}/{{slug}}'
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    format: entry # cms/formats.ts: our own style, then Prettier
    media_folder: /content/bitacora/{{slug}}
    public_folder: .
    i18n: true
    fields:
      - *title
      - *date
      - { name: phase, label: Phase, widget: number, value_type: float, required: false }
      - *tags
      - *reviewed
      - *body

  - name: awesome
    label: Awesome lists
    format: list # cms/formats.ts
    files:
      - name: modern-css
        label: Modern CSS
        file: content/awesome/modern-css.yaml
        fields:
          - &both
            name: title
            label: Title
            widget: object
            fields: [{ name: en, label: English }, { name: es, label: Spanish }]
          - { <<: *both, name: description, label: Description }
          - { name: updated, label: Updated, widget: datetime, type: date, format: YYYY-MM-DD }
          - name: categories
            label: Categories
            widget: list
            summary: '{{name.en}}'
            fields:
              # Always { en, es } here, even when both are the same: a field has one shape.
              - { <<: *both, name: name, label: Name }
              - name: links
                label: Links
                widget: list
                summary: '{{title}}'
                fields:
                  - { name: title, label: Title }
                  - { name: url, label: URL, pattern: ['^https://', 'Must start with https://'] }
                  - { <<: *both, name: description, label: Description }
                  - { name: tags, label: Tags, widget: list }
