<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before the first paint, so a saved theme, palette or text size never flashes.
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				// The colour theme (palettes.ts). An id we don't know matches no CSS: default colours.
				const palette = localStorage.getItem('palette');
				if (palette && /^[a-z-]+$/.test(palette))
					document.documentElement.dataset.palette = palette;
				// The text size (text-size.ts): only the sizes the menu offers.
				const scale = localStorage.getItem('text-scale');
				if (['0.875', '1.125', '1.25', '1.375'].includes(scale))
					document.documentElement.style.setProperty('--text-scale', scale);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
